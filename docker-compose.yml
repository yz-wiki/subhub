name: subhub

# 单服务模式：只运行 SubHub 网关，转换引擎使用外部已有的 subconverter。
# 适合已有 subconverter / 只做前端与订阅管理的场景。
# 完整链路请使用 docker-compose.full.yml。

x-log: &log
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: ${SUBHUB_IMAGE:-subhub/subhub:latest}
    restart: unless-stopped
    <<: *log
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: "8080"
      CONFIG_DIR: /config
      CONFIG_HOST_ROOT: ${CONFIG_HOST_ROOT:-./data}
      # 外部转换引擎地址；默认指向宿主机 25500 端口
      SUBCONVERTER: ${SUBCONVERTER:-http://host.docker.internal:25500}
      # 引擎回源拉取订阅/模板时使用的网关地址
      SELF_URL: ${SELF_URL:-http://host.docker.internal:8080}
      PUBLIC_BASE: ${PUBLIC_BASE:-}
      ADMIN_KEY: ${ADMIN_KEY:-}
      CACHE_TTL: ${CACHE_TTL:-300}
      ENGINE_TIMEOUT: ${ENGINE_TIMEOUT:-120000}
      ALLOW_PRIVATE_SOURCES: ${ALLOW_PRIVATE_SOURCES:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RATE_CONVERT: ${RATE_CONVERT:-30}
      RATE_SUBSCRIBE: ${RATE_SUBSCRIBE:-120}
      SUBHUB_BASE_PATH: ${SUBHUB_BASE_PATH:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/rules:/config/rules
      - ./data/icons:/config/icons
      - ./data/templates:/config/templates
      - ./data/cache:/config/cache
      - ./data/state:/config/state
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - subhub

networks:
  subhub:
    driver: bridge

